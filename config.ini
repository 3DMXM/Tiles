; 瓦片下载配置文件
[download]
; 瓦片URL模板，包含{z}、{x}、{y}替换标记
baseUrl=https://tiles.mapgenie.io/games/oblivion/cyrodiil/default-v1/{z}/{x}/{y}.jpg

; 输出目录
outputDir=tiles

; 缩放级别
zoom=15

; 瓦片范围
minX=16278
minY=16280
maxX=16341
maxY=16355

; 代理设置（可选）
proxy=http://127.0.0.1:10809

; 多线程
threadCount=10

; 分瓦片时的配置
[slice]
tileSize=256
Quality=90